# Alembic configuration for KOSPI Investor Flow.
# Run from the repository root, e.g.:
#   alembic -c infra/migrations/alembic.ini upgrade head
#
# The database URL is taken from application settings (KOSPI_DATABASE_URL) in
# env.py, so it is intentionally left blank here.

[alembic]
script_location = infra/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
